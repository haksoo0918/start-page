<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시작화면에 추가</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      width: 320px;
      padding: 16px;
      background-color: #ffffff;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .popup-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
    }
    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #f36458;
    }
    .popup-title {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 4px;
    }
    .form-input {
      width: 100%;
      padding: 8px 10px;
      font-size: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background-color: #f8fafc;
      color: #0f172a;
      outline: none;
      transition: all 0.15s ease;
    }
    .form-input:focus {
      border-color: #f36458;
      background-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(243, 100, 88, 0.12);
    }
    .popup-footer {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .btn {
      flex: 1;
      padding: 8px 0;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-cancel {
      background-color: #f1f5f9;
      color: #475569;
    }
    .btn-cancel:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }
    .btn-submit {
      background-color: #f36458;
      color: #ffffff;
    }
    .btn-submit:hover {
      background-color: #e0483a;
    }
    .btn-submit:active {
      transform: scale(0.98);
    }
    .status-msg {
      display: none;
      padding: 8px;
      font-size: 11.5px;
      font-weight: 600;
      text-align: center;
      border-radius: 6px;
      margin-top: 10px;
      background-color: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <span class="brand-dot"></span>
    <h3 class="popup-title">시작화면 바로가기 추가</h3>
  </div>

  <form id="add-form">
    <div class="form-group">
      <label class="form-label">웹사이트 주소 (URL)</label>
      <input type="text" id="link-url" class="form-input" required readonly style="cursor: not-allowed; opacity: 0.85;">
    </div>

    <div class="form-group">
      <label class="form-label">사이트 이름</label>
      <input type="text" id="link-title" class="form-input" placeholder="사이트 이름을 입력하세요" required autofocus>
    </div>

    <div class="popup-footer">
      <button type="button" id="btn-close" class="btn btn-cancel">취소</button>
      <button type="submit" id="btn-save" class="btn btn-submit">추가하기</button>
    </div>
  </form>

  <div id="status-msg" class="status-msg">
    ✨ 시작화면에 추가되었습니다!
  </div>

  <script src="popup.js"></script>
</body>
</html>
